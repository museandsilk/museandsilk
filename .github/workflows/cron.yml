name: Reservation expiry cron + DB keep-alive

# Cloudflare Workers cron triggers aren't wired up for this OpenNext deployment, so this scheduled
# GitHub Actions run is what actually calls /api/cron/expire-reservations on a schedule — without
# it, pending_confirmation orders never auto-cancel/release stock, and reservation reminders never
# go out. It also pings /api/health every run, purely to keep Neon's free-tier compute from ever
# fully auto-suspending (its default idle timeout is 5 minutes) — that suspend/wake cycle is what
# causes the site to intermittently error out for a few seconds after hours of no traffic. This
# repo is public, so GitHub Actions minutes here are unlimited and free regardless of frequency.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Keep the database warm
        run: curl -sf "$SITE_URL/api/health"

      - name: Call expire-reservations endpoint
        run: |
          curl -sf -X GET "$SITE_URL/api/cron/expire-reservations" \
            -H "Authorization: Bearer $CRON_SECRET"

      # Books customer-confirmed orders with PostEx and syncs courier status back into the orders.
      # Last and continue-on-error on purpose: a PostEx problem must never fail (or block) the
      # reservation-expiry and DB keep-alive steps above, which real order handling depends on.
      - name: PostEx auto-booking + status sync
        continue-on-error: true
        run: |
          curl -sf -X GET "$SITE_URL/api/cron/postex-sync" \
            -H "Authorization: Bearer $CRON_SECRET"

      # Announces flash sales that just went live (push to opted-in shoppers) and repairs any
      # reserved-stock drift. Also non-blocking.
      - name: Flash-sale alerts + stock reconciliation
        continue-on-error: true
        run: |
          curl -sf -X GET "$SITE_URL/api/cron/sales"             -H "Authorization: Bearer $CRON_SECRET"
