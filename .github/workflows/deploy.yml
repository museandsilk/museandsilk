name: Deploy to Cloudflare Workers

# Two Workers come out of this repo (see scripts/build-target.mjs):
#   nure-asmir        – the customer storefront (no admin code in the bundle)
#   nure-asmir-admin  – the owner's admin panel
# Database migrations run first so a deploy never ships code that needs a column that is not there.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # NEXT_PUBLIC_* vars are inlined into the client bundles at build time.
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STORE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_ADMIN_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GOOGLE_MERCHANT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MERCHANT_ID }}
      NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx drizzle-kit migrate

      # Runtime secrets the Workers read via process.env. Each value arrives through `env:` and is piped
      # with printf '%s' — never interpolated into the script text — so a secret containing shell syntax
      # cannot alter the command. Pushed on every deploy so a rotated GitHub secret stays in sync.
      - name: Sync Worker secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          WHATSAPP_DEFAULT_NUMBER: ${{ secrets.WHATSAPP_DEFAULT_NUMBER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CSP_NONCE: ${{ secrets.CSP_NONCE }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          TCS_USERNAME: ${{ secrets.TCS_USERNAME }}
          TCS_PASSWORD: ${{ secrets.TCS_PASSWORD }}
          TCS_ACCOUNT_NO: ${{ secrets.TCS_ACCOUNT_NO }}
          TCS_COST_CENTER_CODE: ${{ secrets.TCS_COST_CENTER_CODE }}
          TCS_ENV: ${{ secrets.TCS_ENV }}
          TCS_SERVICE_CODE: ${{ secrets.TCS_SERVICE_CODE }}
        run: |
          set -euo pipefail
          # The Workers must exist before secrets can be attached, so deploy first on a brand-new account
          # (the build steps below do this), then re-run. On an existing account this step just works.
          for config in wrangler.jsonc wrangler.admin.jsonc; do
            for name in DATABASE_URL SESSION_SECRET ADMIN_EMAIL ADMIN_INITIAL_PASSWORD AWS_ENDPOINT_URL_S3 AWS_ACCESS_KEY_ID \
              AWS_SECRET_ACCESS_KEY AWS_REGION ALGOLIA_APP_ID ALGOLIA_ADMIN_KEY FIREBASE_SERVICE_ACCOUNT RESEND_API_KEY \
              RESEND_FROM_EMAIL RESEND_FROM_NAME WHATSAPP_DEFAULT_NUMBER CRON_SECRET GROQ_API_KEY TURNSTILE_SECRET_KEY \
              CSP_NONCE WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET WHATSAPP_TEMPLATE_NAME \
              WHATSAPP_WEBHOOK_VERIFY_TOKEN TCS_USERNAME TCS_PASSWORD TCS_ACCOUNT_NO TCS_COST_CENTER_CODE TCS_ENV TCS_SERVICE_CODE; do
              value="${!name:-}"
              if [ -n "$value" ]; then
                printf '%s' "$value" | npx wrangler secret put "$name" -c "$config" || echo "::warning::could not set $name on $config"
              fi
            done
          done

      - name: Create the ISR cache bucket if it does not exist
        run: |
          if ! npx wrangler r2 bucket info nure-asmir-cache >/dev/null 2>&1; then
            npx wrangler r2 bucket create nure-asmir-cache
          fi

      - name: Build storefront
        run: npm run cf:build:store

      - name: Deploy storefront
        run: npx wrangler deploy -c wrangler.jsonc

      # The ISR page cache lives in a Cloudflare R2 bucket (nure-asmir-cache) that persists across
      # deploys, while every build's JS/CSS chunk filenames are freshly content-hashed. Without this, a
      # page cached by the previous build would keep being served after the deploy, referencing chunks
      # that no longer exist. Scoped to "incremental-cache/" in that bucket only – product, category and
      # campaign images live in Neon Object Storage and are never touched.
      - name: Purge stale ISR page cache
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: nure-asmir-cache
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: npx tsx scripts/purge-isr-cache.ts

      - name: Build admin
        run: npm run cf:build:admin

      - name: Deploy admin
        run: npx wrangler deploy -c wrangler.admin.jsonc
