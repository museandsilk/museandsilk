name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runtime secrets the Worker reads via process.env at request time. Pushed on every deploy
      # so a rotated GitHub secret always ends up in sync on Cloudflare's side too.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
          echo "${{ secrets.ADMIN_EMAIL }}" | npx wrangler secret put ADMIN_EMAIL
          echo "${{ secrets.ADMIN_INITIAL_PASSWORD }}" | npx wrangler secret put ADMIN_INITIAL_PASSWORD
          echo "${{ secrets.AWS_ENDPOINT_URL_S3 }}" | npx wrangler secret put AWS_ENDPOINT_URL_S3
          echo "${{ secrets.AWS_ACCESS_KEY_ID }}" | npx wrangler secret put AWS_ACCESS_KEY_ID
          echo "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | npx wrangler secret put AWS_SECRET_ACCESS_KEY
          echo "${{ secrets.AWS_REGION }}" | npx wrangler secret put AWS_REGION
          echo "${{ secrets.ALGOLIA_APP_ID }}" | npx wrangler secret put ALGOLIA_APP_ID
          echo "${{ secrets.ALGOLIA_ADMIN_KEY }}" | npx wrangler secret put ALGOLIA_ADMIN_KEY
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY
          echo "${{ secrets.RESEND_FROM_EMAIL }}" | npx wrangler secret put RESEND_FROM_EMAIL
          echo "${{ secrets.RESEND_FROM_NAME }}" | npx wrangler secret put RESEND_FROM_NAME
          echo "${{ secrets.WHATSAPP_DEFAULT_NUMBER }}" | npx wrangler secret put WHATSAPP_DEFAULT_NUMBER
          echo "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET
          echo "${{ secrets.GROQ_API_KEY }}" | npx wrangler secret put GROQ_API_KEY
          echo "${{ secrets.TURNSTILE_SECRET_KEY }}" | npx wrangler secret put TURNSTILE_SECRET_KEY
          echo "${{ secrets.CSP_NONCE }}" | npx wrangler secret put CSP_NONCE
          echo "${{ secrets.WHATSAPP_ACCESS_TOKEN }}" | npx wrangler secret put WHATSAPP_ACCESS_TOKEN
          echo "${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" | npx wrangler secret put WHATSAPP_PHONE_NUMBER_ID
          echo "${{ secrets.WHATSAPP_APP_SECRET }}" | npx wrangler secret put WHATSAPP_APP_SECRET
          echo "${{ secrets.WHATSAPP_TEMPLATE_NAME }}" | npx wrangler secret put WHATSAPP_TEMPLATE_NAME
          echo "${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}" | npx wrangler secret put WHATSAPP_WEBHOOK_VERIFY_TOKEN
          echo "${{ secrets.POSTEX_API_TOKEN }}" | npx wrangler secret put POSTEX_API_TOKEN
          echo "${{ secrets.POSTEX_PICKUP_ADDRESS_CODE }}" | npx wrangler secret put POSTEX_PICKUP_ADDRESS_CODE
          echo "${{ secrets.POSTEX_AUTO_BOOK_FROM }}" | npx wrangler secret put POSTEX_AUTO_BOOK_FROM

      # NEXT_PUBLIC_* vars must be present at build time — they get inlined into client bundles.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_MERCHANT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MERCHANT_ID }}
          NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
          NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
          NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run cf:build

      - name: Create the ISR cache bucket (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create nure-asmir-cache || true

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # The ISR page cache (open-next.config.ts) lives in a Cloudflare R2 bucket (nure-asmir-cache), which persists across deploys, while
      # every build's JS/CSS chunk filenames are freshly content-hashed. Without this, a page cached
      # under the previous build keeps getting served after this deploy goes live, referencing chunk
      # files that no longer exist — a real 404 in the browser for a stylesheet or script, breaking
      # the page. Scoped only to "incremental-cache/" in that cache bucket (see the script) — it never
      # touches product, category or campaign images, which live in Neon Object Storage.
      - name: Purge stale ISR page cache
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: nure-asmir-cache
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: npx tsx scripts/purge-isr-cache.ts
